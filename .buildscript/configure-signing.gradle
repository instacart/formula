apply plugin: "signing"
apply plugin: "com.vanniktech.maven.publish"

// Find the first non-null Gradle property or environment variable
// corresponding to the given names, giving preference to Gradle properties.
String propOrEnv(String... names) {
    // hasProperty, getProperty don't work when called directly in a closure;
    // they need a receiver that knows about properties, like rootProject.
    def p = rootProject
    def result = names.findResult { p.hasProperty(it) ? p.getProperty(it) : System.getenv(it) }
    if (result == null) {
        logger.error("Missing gradle property or environment variable: $names")
    }
    return result
}

// GROUP, POM_ARTIFACT_ID and VERSION_NAME drive the published coordinates; the
// plugin reads them from Gradle properties automatically.

if (project.hasProperty('artifactoryRelease')) {
    // Artifactory publishing (no signing required)
    publishing {
        repositories {
            maven {
                name = "artifactory"
                url = propOrEnv("ARTIFACTORY_URL", "instacart_artifactory_url")
                credentials {
                    username = propOrEnv("ARTIFACTORY_USERNAME", "instacart_artifactory_username")
                    password = propOrEnv("ARTIFACTORY_PASSWORD", "instacart_artifactory_password")
                }
            }
        }
    }
    // The old plugin exposed `uploadArchives`; keep it as the release entry point.
    tasks.register("uploadArchives") {
        group = "publishing"
        description = "Publishes all publications to Artifactory."
        dependsOn "publishAllPublicationsToArtifactoryRepository"
    }
} else if (project.hasProperty('mavenCentralRelease')) {
    // Maven Central publishing (requires signing)
    Properties properties = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
    }

    // Support both env vars (CI) and local.properties (local dev)
    def signingKeyEnv = System.getenv('SIGNING_KEY')
    def signingKey
    if (signingKeyEnv) {
        // CI: key content directly from env var
        signingKey = signingKeyEnv
    } else {
        // Local: read from file specified in local.properties
        def signingKeyFilename = properties.signingKey
        if (signingKeyFilename) {
            signingKey = "${project.rootProject.file(signingKeyFilename).newDataInputStream()}"
        }
    }
    def signingPassword = System.getenv('SIGNING_PASSWORD') ?: properties.signingPassword

    signing {
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    }

    // Map the legacy Sonatype credential names to the ones this plugin reads.
    def centralUsername = System.getenv('SONATYPE_NEXUS_USERNAME') ?: properties.SONATYPE_NEXUS_USERNAME
    def centralPassword = System.getenv('SONATYPE_NEXUS_PASSWORD') ?: properties.SONATYPE_NEXUS_PASSWORD
    if (centralUsername != null) {
        project.ext.mavenCentralUsername = centralUsername
    }
    if (centralPassword != null) {
        project.ext.mavenCentralPassword = centralPassword
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
    }
    // The old plugin exposed `uploadArchives`; keep it as the release entry point.
    tasks.register("uploadArchives") {
        group = "publishing"
        description = "Publishes all publications to Maven Central."
        dependsOn "publishToMavenCentral"
    }
}
// Local development (no publishing) needs no target: the plugin still registers
// the publication so publishToMavenLocal works.
